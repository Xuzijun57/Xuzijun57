name: Update profile card
on:
  push:
    paths:
      - ".github/workflows/profile-card.yml"
      - "scripts/profile_card.py"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate card from public statistics
        run: python3 scripts/profile_card.py
      - name: Save card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile statistics"
            git push
          fi
